[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-digest-pipeline"
version = "0.1.0"
description = "Discover, rank, and synthesize arXiv or conference papers with a budget-aware six-part workflow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5.0"]

[project.scripts]
paper-digest = "paper_digest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
