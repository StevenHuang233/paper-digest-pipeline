# Paper Digest 的唯一运行配置文件。
# 本文件可以安全提交到 Git；API Key、邮箱账号和邮箱授权码必须放在 GitHub Secrets 中。

[project]
name = "multimodal-opd-daily-digest" # 项目名，也用于区分输出
language = "zh-CN"                   # 六段式总结语言，例如 zh-CN、en、ja
output_dir = "outputs"               # 所有候选、筛选记录和总结产物的根目录

[preferences]
# 兴趣描述是 LLM 判断 include/exclude 的主要依据。建议写清“研究对象 + 问题 + 方法偏好”。
interests = [
  "multimodal large language models, vision-language models, and unified multimodal representation learning",
  "multimodal reasoning, visual grounding, multimodal retrieval, generation, and evaluation",
  "embodied multimodal agents, vision-language-action models, perception-to-decision systems",
  "on-policy distillation (OPD), including language-only and multimodal OPD"
]
# 正向关键词仅作为提示，不是必须命中条件。适合放缩写、别名、任务名和模型家族。
include_keywords = [
  "multimodal", "multi-modal", "vision-language", "vision language", "VLM", "MLLM",
  "audio-visual", "cross-modal", "visual grounding", "multimodal reasoning",
  "vision-language-action", "embodied agent", "omnimodal", "OPD", "on-policy distillation"
]
# 负向关键词是不可撤销的硬排除；只有在某个短语必然不相关时才填写。
exclude_keywords = []
# arXiv 会在服务端按类别过滤。类别过窄会漏论文，下面覆盖主要 AI 相关方向。
categories = ["cs.AI", "cs.LG", "cs.CL", "cs.CV", "cs.MM", "cs.IR", "cs.RO", "cs.HC", "cs.NE", "stat.ML"]

[discovery]
source = "arxiv"                    # arxiv | crossref | openreview | json
date = "yesterday"                  # today | yesterday | YYYY-MM-DD；每日任务建议 yesterday
max_candidates = 2000               # 进入筛选的候选上限
page_size = 200                      # arXiv 单页数量
request_delay_seconds = 3.1          # arXiv 多页请求间隔，建议不低于 3 秒
request_timeout_seconds = 120        # 单次 arXiv 请求超时；超时后会自动重试
request_attempts = 4                 # arXiv 临时超时或 429/5xx 时的最大尝试次数
json_path = ""                       # source=json 时填写，路径相对于本文件

[discovery.openreview]
venue_id = "ICLR.cc/2026/Conference" # source=openreview 时填写
status = "accepted"                  # accepted | all
submission_invitation = ""           # status=all 且默认 invitation 不适用时填写
base_url = "https://api2.openreview.net"

[discovery.crossref]
conference = "Advances in Neural Information Processing Systems" # source=crossref 时填写
from_date = "2025-01-01"
until_date = "2025-12-31"
mailto = ""                          # 可选：填写联系邮箱可使用 Crossref polite pool
min_venue_similarity = 0.15
base_url = "https://api.crossref.org"

[selection]
ranker = "llm"                       # llm：二元语义筛选；rules：零成本规则预筛
min_score = 0.0                       # 仅 rules 模式使用；LLM 二元筛选忽略此值
max_selected_papers = 500             # include 后最多保留数量，不会自动全部生成全文总结
rules_preview_min_score = 0.0          # --dry-run 的规则预览阈值
llm_batch_size = 40                    # 每次筛选请求包含的论文数
llm_abstract_chars = 1600              # 每篇送入筛选模型的摘要字符上限
llm_max_output_tokens = 4000           # 每批二元决策的最大输出 token
llm_thinking_mode = "disabled"         # 筛选阶段关闭思考模式以降低成本
llm_response_attempts = 3             # 筛选批次漏回论文 ID 时的内容级重试次数
decision_rounds = 2                     # 独立判断轮数；出现分歧时自动追加最终裁决
decision_shuffle_seed = "paper-digest-decision-v2" # 稳定乱序，避免批次与原始位置影响结论
# 这是筛选的最终判定边界。模型返回 include/exclude、命中类别和证据，不进行分数排序。
decision_policy = """
Include a paper only when either condition A or condition B is directly satisfied by its primary
contribution. For every include, return the single strongest matching label A or B. If neither label can
be justified from the title and abstract, exclude the paper even if it may be broadly useful.

A. Its primary contribution studies genuinely multimodal learning involving at least two distinct
modalities or signal types, such as image/video, text, audio, touch, or action. This includes VLM/MLLM,
vision-language or audio-visual learning, multimodal reasoning, grounding, cross-modal retrieval,
multimodal RAG, multimodal datasets/evaluation, and embodied or computer-use agents whose visual or
multimodal observations are central. Agent and reward-model evaluation papers count when they directly
evaluate such multimodal agents.

B. Its primary contribution studies OPD or on-policy distillation, including language-only OPD as well
as multimodal OPD. OPD relevance alone is sufficient for inclusion.

Exclude pure single-modality image/video generation, coding, reconstruction, segmentation, enhancement,
or multi-view vision unless language, audio, touch, action, or another distinct modality is central to the
method. Also exclude incidental multimodal mentions, unrelated applications that merely call a foundation
model, and papers without enough title/abstract evidence. A reusable-sounding idea is not sufficient
unless the paper itself directly studies A or B. Apply these rules consistently across batches.
"""

# 可选的第二阶段价值精选。关闭时仍会严格按 max_selected_papers 截断；开启时由 LLM 比较后保留上限内最值得读的论文。
llm_prioritize = false
priority_batch_size = 50               # 局部比较的论文数
priority_local_buffer_ratio = 1.0       # 每个轮换面板按全局保留比例晋级；建议保持 1.0
priority_rounds = 3                     # 使用不同顺序和对手组合进行三轮比较
priority_shuffle_seed = "paper-digest-priority-v2" # 稳定轮换种子，避免原始顺序偏差
priority_abstract_chars = 1200          # 每篇送入精选模型的摘要字符上限
priority_max_output_tokens = 5000       # 每次精选请求的最大输出 token
priority_policy = """
Prioritize papers by fit to the configured interests, methodological novelty, technical depth,
experimental credibility, and usefulness for developing new research ideas. Preserve topic diversity
and avoid filling the shortlist with near-duplicate papers. Do not assign numeric scores.
"""

[review]
max_papers = 10                       # 每次做 PDF 全文六段式总结的上限；设为 500 可总结全部入选论文
max_attempts = 3                      # 单篇总结遇到接口或 JSON 校验错误时最多尝试 3 次
fail_on_incomplete = false            # false：有可用总结即正常交付，邮件仍显示失败数量

[backend]
type = "openai_compatible"            # openai_compatible | codex；Actions 推荐前者
base_url = "https://api.deepseek.com"
model = "deepseek-v4-flash"
api_key_env = "PAPER_DIGEST_API_KEY"  # 这里只写环境变量名，绝不能写真实密钥
max_output_tokens = 5500               # 单篇六段式总结最大输出 token
temperature = 0.2
timeout_seconds = 600
request_attempts = 3                  # 单次 LLM 调用遇到超时、429、临时 5xx 或畸形响应时的重试次数
request_backoff_seconds = 2.0         # LLM 重试退避基数；实际等待约 2、4、8……秒
codex_model = ""                       # type=codex 时可指定模型，留空使用 Codex 默认值
json_mode = true
thinking_mode = "disabled"
supports_thinking_toggle = true        # DeepSeek OpenAI 兼容接口的 thinking 开关

[fulltext]
download_pdf = true                    # true：下载并读取 PDF；false：只按摘要总结
max_main_text_chars = 180000            # 截止附录/补充材料/致谢/参考文献前的正文字符上限

[budget]
max_total_tokens = 3000000             # 单次运行的硬 token 上限
max_estimated_usd = 15.0                # 单次运行的预估费用硬上限（美元）
# 按服务商当前价格填写；0 表示不做美元估算，但 token 上限仍生效。
input_usd_per_million = 0.0
output_usd_per_million = 0.0

[output]
formats = ["json", "markdown", "latex"]
compile_pdf = true                     # Actions 会安装 XeLaTeX 并生成 digest.pdf

[email]
enabled = true                         # false 可暂时关闭邮件，但仍正常生成和上传产物
provider = "qq"                        # qq | gmail | netease | auto | custom
# 使用 qq/gmail/netease 时，下面三项保持默认即可；程序会自动选择 SMTP 参数。
# provider=netease 时会根据发件地址识别 163.com、126.com、yeah.net 和 VIP 邮箱。
smtp_host = ""                         # custom 时必填；预设模式留空，也可用于覆盖预设
smtp_port = 0                           # 0 表示使用服务商预设端口
security = "auto"                      # auto | ssl | starttls；auto 表示使用服务商预设
subject_prefix = "[Paper Digest]"
username_env = "PAPER_DIGEST_SMTP_USERNAME" # 发件邮箱地址对应的 GitHub Secret 名称
password_env = "PAPER_DIGEST_SMTP_PASSWORD" # 邮箱 SMTP 授权码，不是网页登录密码
to_env = "PAPER_DIGEST_EMAIL_TO"           # 收件人；多个地址可用英文逗号分隔
from_env = "PAPER_DIGEST_EMAIL_FROM"        # 可选；未设置时使用发件邮箱
attach_pdf = true
attach_markdown = false                  # 邮件只发送 PDF；Markdown 仍保存在 Actions Artifact
require_pdf_attachment = true            # 成功邮件必须包含 PDF，否则任务明确失败
attach_log_on_failure = true
max_attachment_mb = 20                # 单个附件上限，避免被邮箱服务器拒收
timeout_seconds = 60
