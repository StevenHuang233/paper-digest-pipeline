name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: pip install -e .

      - name: Verify imported checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          import paper_digest

          imported = Path(paper_digest.__file__).resolve()
          expected = (Path.cwd() / "src" / "paper_digest").resolve()
          if expected not in imported.parents:
              raise SystemExit(f"Imported {imported}, expected a module under {expected}")
          print(imported)
          PY

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q src tests
