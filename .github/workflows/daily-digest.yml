name: Daily paper digest

on:
  schedule:
    # GitHub Actions 使用 UTC；01:30 UTC = 北京时间 09:30。
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "可选：覆盖 config.toml 中的日期（today、yesterday 或 YYYY-MM-DD）"
        required: false
        type: string
      max_papers:
        description: "可选：覆盖本次全文总结数量；留空使用 config.toml"
        required: false
        type: string

concurrency:
  group: daily-paper-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      PAPER_DIGEST_API_KEY: ${{ secrets.PAPER_DIGEST_API_KEY }}
      PAPER_DIGEST_SMTP_USERNAME: ${{ secrets.PAPER_DIGEST_SMTP_USERNAME }}
      PAPER_DIGEST_SMTP_PASSWORD: ${{ secrets.PAPER_DIGEST_SMTP_PASSWORD }}
      PAPER_DIGEST_EMAIL_TO: ${{ secrets.PAPER_DIGEST_EMAIL_TO }}
      PAPER_DIGEST_EMAIL_FROM: ${{ secrets.PAPER_DIGEST_EMAIL_FROM }}
      PAPER_DIGEST_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装项目和中文 LaTeX
        shell: bash
        run: |
          pip install -e ".[pdf]"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-lang-chinese texlive-fonts-recommended \
            fonts-noto-cjk

      - name: 生成论文日报
        id: generate
        continue-on-error: true
        shell: bash
        env:
          OVERRIDE_DATE: ${{ inputs.date }}
          OVERRIDE_MAX_PAPERS: ${{ inputs.max_papers }}
        run: |
          args=(run --config config.toml)
          if [[ -n "$OVERRIDE_DATE" ]]; then
            args+=(--date "$OVERRIDE_DATE")
          fi
          if [[ -n "$OVERRIDE_MAX_PAPERS" ]]; then
            args+=(--max-papers "$OVERRIDE_MAX_PAPERS")
          fi

          set +e
          paper-digest "${args[@]}" 2> >(tee run.log >&2) | tee run-result.json
          exit_code=${PIPESTATUS[0]}
          set -e

          # A progressive manifest survives late failures such as PDF compilation.
          # Recover it so failure emails still contain real counts and the stage.
          if ! jq -e 'type == "object"' run-result.json >/dev/null 2>&1; then
            manifest_file="$(find outputs -type f -name manifest.json -print -quit 2>/dev/null || true)"
            if [[ -n "$manifest_file" ]]; then
              cp "$manifest_file" run-result.json
            fi
          fi

          digest_status="failure"
          if [[ "$exit_code" -eq 0 ]] && jq -e . run-result.json >/dev/null 2>&1; then
            manifest_status="$(jq -r '.status // "failure"' run-result.json)"
            if [[ "$manifest_status" == "complete" ]]; then
              digest_status="success"
            elif [[ "$manifest_status" == "partial" ]]; then
              digest_status="partial"
              exit_code=2
            fi
          fi
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          echo "digest_status=$digest_status" >> "$GITHUB_OUTPUT"

      - name: 发送邮件通知
        id: notify
        if: always()
        continue-on-error: true
        shell: bash
        env:
          DIGEST_STATUS: ${{ steps.generate.outputs.digest_status || 'failure' }}
        run: |
          paper-digest email \
            --config config.toml \
            --result run-result.json \
            --status "$DIGEST_STATUS" \
            --log run.log \
            --run-url "$PAPER_DIGEST_RUN_URL"

      - name: 上传生成结果和日志
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: paper-digest-${{ github.run_id }}
          path: |
            outputs/
            !outputs/**/pdfs/**
            run-result.json
            run.log
          if-no-files-found: warn
          retention-days: 30

      - name: 汇总任务状态
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.generate.outputs.exit_code || '1' }}" != "0" ]]; then
            echo "论文日报生成失败或只完成了一部分，请查看 run.log 和 Artifacts。" >&2
            exit 1
          fi
          if [[ "${{ steps.notify.outcome }}" != "success" ]]; then
            echo "论文日报已生成，但邮件发送失败，请检查 SMTP Secrets 和邮箱授权码。" >&2
            exit 1
          fi
